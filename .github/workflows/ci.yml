name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install ffmpeg (integration tests skip without it, CI should not)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      # `pnpm build` must run BEFORE `pnpm typecheck`. packages/vue and packages/demo
      # resolve the workspace dependency `@topclans/looped-loader-core` through the
      # declarations it emits into `packages/core/dist`, which is gitignored and
      # therefore absent in a fresh clone; without it `vue-tsc` fails with TS2307 and
      # a cascade of TS7006 "implicitly has an 'any' type". The same applies to
      # `pnpm test`, whose jsdom suites import the built core. The first push of
      # `main` went red exactly here, which is how the ordering was found.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
